<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반도체 기업 AI 분석 및 전망 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #e3f2fd, #fce4ec); font-family: Arial, sans-serif; color: #333; }
    .container { width: min(900px, 92%); margin: 40px auto; background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16); }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; color: #1e3a8a; }
    h2 { margin-top: 0; font-size: 22px; color: #0f172a; }
    .subtitle { text-align: center; color: #555; margin-bottom: 28px; font-size: 14px; }
    .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    input, select { height: 46px; padding: 0 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; background: #ffffff; }
    input:focus, select:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }
    button { border: none; border-radius: 12px; padding: 0 16px; height: 46px; font-size: 15px; cursor: pointer; transition: 0.15s; font-weight: bold; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; }
    .analyze-btn { background: #2563eb; color: white; font-size: 16px; }
    .refresh-btn { background: #66bb6a; color: white; margin-bottom: 16px; }
    .tts-btn { background: #f59e0b; color: white; }
    .delete-btn { background: #ef5350; color: white; }
    .form-box { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 22px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; padding: 14px; border-radius: 16px; background: #f7f9fb; }
    .user-info { font-size: 14px; color: #555; word-break: break-all; }
    .status { min-height: 24px; margin-bottom: 14px; color: #2563eb; font-size: 14px; font-weight: bold; text-align: center; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: #f7f9fb; border: 1px solid #edf1f5; }
    .item-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
    .item-title { margin: 0; font-size: 18px; font-weight: bold; color: #1e3a8a; }
    .item-content { margin: 0; color: #334155; line-height: 1.6; word-break: break-all; white-space: pre-wrap; }
    .item-date { margin-top: 8px; font-size: 12px; color: #94a3b8; }
    .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .empty { text-align: center; padding: 30px; color: #888; background: #f7f9fb; border-radius: 16px; }
    .hidden { display: none; }
    .notice { max-width: 620px; margin: 20px auto 0; padding: 14px; border-radius: 14px; background: #fff8e1; color: #6d4c41; font-size: 14px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Semiconductor Insight Lab</h1>
    <div class="subtitle">반도체 주요 기업 AI 정밀 분석 및 TTS 브리핑 플랫폼 (GAS Script Property 기반)</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>연구원 로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" value="student@test.com" />
        <input id="passwordInput" type="password" placeholder="비밀번호 6자리 이상" value="123456" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>
      <div class="notice">
        시연용 예시 계정이 자동으로 입력되어 있습니다.<br />
        <strong>[회원가입]</strong> 버튼을 먼저 누르고, 다음부터는 <strong>[로그인]</strong>을 누르시면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">접속 라이선스: <strong id="userEmail"></strong></div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="form-box">
        <select id="companySelect">
          <option value="삼성전자">삼성전자 (Samsung Electronics)</option>
          <option value="SK하이닉스">SK하이닉스 (SK hynix)</option>
          <option value="TSMC">TSMC (대만 파운드리)</option>
          <option value="엔비디아">NVIDIA (AI 가속기 글로벌 리더)</option>
        </select>
        <button class="analyze-btn" id="analyzeBtn">GPT 실시간 분석 리포트 생성</button>
      </div>

      <div id="status" class="status"></div>
      
      <button class="refresh-btn" id="refreshBtn">내 리포트 보관함 새로고침</button>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 파이어베이스 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyBPb-lfL3mUF7AGYISs1YkrlYIZRLwpkck",
      authDomain: "test-552d7.firebaseapp.com",
      databaseURL: "https://test-552d7-default-rtdb.firebaseio.com",
      projectId: "test-552d7",
      storageBucket: "test-552d7.firebasestorage.app",
      messagingSenderId: "623769303972",
      appId: "1:623769303972:web:89b75480e03e5ccec59f31",
      measurementId: "G-K1JG20P0SC"
    };

    // 🔗 ⚠️ [필수 입력] 새로 배포된 구글 앱스크립트 웹앱 주소로 채워넣으세요!
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiOqGIfTW-aMJ3Xz3NAt69Ce3Isp-bGUnIUZzNnHFMcK51klc8Rj13RsdrCPLqWDAK/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    const companySelect = document.getElementById('companySelect');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(message) { statusBox.textContent = message; }

    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim(); const password = passwordInput.value.trim();
      if (!email || !password) return alert('이메일과 비밀번호를 모두 입력해주세요.');
      try { await createUserWithEmailAndPassword(auth, email, password); alert('회원가입 완료! 자동으로 로그인됩니다.'); } 
      catch (error) { alert(error.message); }
    });

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim(); const password = passwordInput.value.trim();
      if (!email || !password) return alert('이메일과 비밀번호를 모두 입력해주세요.');
      try { await signInWithEmailAndPassword(auth, email, password); } 
      catch (error) { alert(error.message); }
    });

    logoutBtn.addEventListener('click', () => { window.speechSynthesis.cancel(); signOut(auth); });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        userEmail.textContent = user.email;
        startRealtimeDataListener(user.uid);
      } else {
        currentUser = null;
        authSection.classList.remove('hidden'); mainSection.classList.add('hidden');
        dataList.innerHTML = '';
      }
    });

    function startRealtimeDataListener(uid) {
      stopRealtimeDataListener();
      setStatus('클라우드 서버에서 리포트를 불러오는 중...');
      currentItemsRef = ref(database, `users/${uid}/items`);
      onValue(currentItemsRef, (snapshot) => {
        renderData(snapshot.val());
        setStatus('동기화 완료: 실시간 반도체 리포트 대시보드');
      }, (error) => { setStatus('DB 통신 오류.'); });
    }

    function stopRealtimeDataListener() { if (currentItemsRef) { off(currentItemsRef); currentItemsRef = null; } }

    analyzeBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      if (APPS_SCRIPT_URL.includes("여기에_구글")) {
        alert("코드 상단의 APPS_SCRIPT_URL 변수에 구글 웹앱 주소를 입력하세요!");
        return;
      }
      
      const company = companySelect.value;
      setStatus(`구글 앱스크립트 속성 보안망을 경유하여 ${company} 분석 중...`);
      analyzeBtn.disabled = true;

      const prompt = `${company}의 현재 핵심 반도체 기술 현황(HBM 및 나노 공정)과 미래 시장 전망을 애널리스트 관점에서 명확하게 딱 3가지로만 요약해줘. 어조는 문장형(~입니다)으로 격식 있게 작성해줘.`;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'chat',
            question: prompt,
            model: 'gpt-4o-mini'
          })
        });

        const resData = await response.json();
        
        if(resData.error) {
          alert("서버 내부 오류: " + resData.error);
          setStatus("분석 실패");
          return;
        }

        let aiResult = "";
        if (typeof resData === 'string') aiResult = resData;
        else if (resData.reply) aiResult = resData.reply;
        else if (resData.text) aiResult = resData.text;
        else if (resData.choices && resData.choices[0]?.message) aiResult = resData.choices[0].message.content;
        else aiResult = JSON.stringify(resData);

        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);
        await set(newItemRef, {
          title: `${company} 종합 인텔리전스 보고서`,
          content: aiResult,
          createdAt: new Date().toLocaleString('ko-KR')
        });

        setStatus('보안 프록시 연동 분석 성공 및 실시간 DB 저장 완료!');
      } catch (error) {
        console.error(error);
        alert('통신 오류가 발생했습니다: ' + error.message);
        setStatus('서버 통신 실패');
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    refreshBtn.addEventListener('click', () => { if (currentUser) startRealtimeDataListener(currentUser.uid); });

    window.speakData = function(id) {
      const contentText = document.getElementById(`content-${id}`).innerText;
      window.speechSynthesis.cancel(); 
      const cleanText = contentText.replace(/[*#\-]/g, '');
      const speech = new SpeechSynthesisUtterance(cleanText);
      speech.lang = 'ko-KR';
      window.speechSynthesis.speak(speech);
      setStatus('선택한 보고서 음성 브리핑 서비스 작동 중...');
    };

    window.deleteData = async function(id) {
      if (!currentUser) return;
      if (!confirm('해당 리포트를 삭제하시겠습니까?')) return;
      window.speechSynthesis.cancel();
      try { await remove(ref(database, `users/${currentUser.uid}/items/${id}`)); } 
      catch (error) { alert('삭제 실패'); }
    };

    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) { dataList.innerHTML = '<div class="empty">보관된 데이터가 없습니다. 상단에서 리포트를 생성하세요.</div>'; return; }
      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-header">
            <p class="item-title">${escapeHTML(item.title || '')}</p>
            <div class="item-date">분석일시: ${item.createdAt || '-'}</div>
          </div>
          <p class="item-content" id="content-${id}">${escapeHTML(item.content || '')}</p>
          <div class="item-footer">
            <button class="tts-btn" onclick="speakData('${id}')">🔊 음성 브리핑 듣기</button>
            <button class="delete-btn" onclick="deleteData('${id}')">리포트 파기</button>
          </div>`;
        dataList.appendChild(div);
      });
    }

    function escapeHTML(text) { return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
  </script>
</body>
</html>
